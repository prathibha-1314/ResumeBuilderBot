<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – ResumeBuilder.Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="auth-wrapper">
    <div class="card auth-card">
        <div style="text-align:center; margin-bottom:8px;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" style="height:64px; border-radius:12px;">
        </div>
        <h2 style="text-align:center; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; font-size:1.6rem;">ResumeBuilder.Bot</h2>
        <p style="text-align:center; color:#64748b; margin-bottom:24px;">
            Log in to your account
        </p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required
                       placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       placeholder="Your password">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">
                Log In
            </button>
        </form>

        <p style="text-align:center; margin-top:16px; font-size:0.9rem; color:#94a3b8;">
            Don't have an account?
            <a href="{{ url_for('signup') }}">Sign up</a>
        </p>
    </div>
</div>

</body>
</html>
