<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeBuilder.Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .splash-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .splash-logo {
            width: 120px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite, glow 2s ease-in-out infinite alternate;
        }
        .splash-title {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeIn 1.5s ease-out forwards;
            opacity: 0;
            margin-bottom: 10px;
        }
        .splash-subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            animation: fadeIn 1.5s ease-out 0.5s forwards;
            opacity: 0;
        }
        .loading-bar {
            width: 200px;
            height: 4px;
            background: rgba(100, 116, 139, 0.3);
            border-radius: 4px;
            margin-top: 30px;
            overflow: hidden;
            position: relative;
            animation: fadeIn 1.5s ease-out 1s forwards;
            opacity: 0;
        }
        .loading-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
            animation: loading 2s linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        @keyframes glow {
            0% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
            100% { filter: drop-shadow(0 0 25px rgba(129, 140, 248, 0.8)); }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes loading {
            0% { left: -100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="splash-screen">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="ResumeBuilder.Bot Logo" class="splash-logo">
        <div class="splash-title">ResumeBuilder.Bot</div>
        <div class="splash-subtitle">Smart ATS Resume Generator</div>
        <div class="loading-bar"></div>
    </div>

    <script>
        // Redirect to login page after 3 seconds
        setTimeout(function() {
            window.location.href = "{{ url_for('login') }}";
        }, 3000);
    </script>
</body>
</html>
